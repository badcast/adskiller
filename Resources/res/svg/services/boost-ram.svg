<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Gauge Background Dial Arc -->
  <path d="M 12 36 A 16 16 0 1 1 36 36" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Gauge Active Zone (Cyan to Gold/Red) -->
  <path d="M 12 36 A 16 16 0 0 1 24 8" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 24 8 A 16 16 0 0 1 36 36" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Dial Ticks -->
  <line x1="13" y1="24" x2="17" y2="24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="13" x2="24" y2="17" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="29" y2="19" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Needle in Turbo Zone -->
  <line x1="24" y1="27" x2="33" y2="17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="27" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Boost Lightning Bolt -->
  <polygon points="23,28 17,37 22,37 20,44 28,34 23,34" fill="#FBBF24" stroke="#F59E0B" stroke-width="1" stroke-linejoin="round"/>
  <!-- Turbo Motion Lines -->
  <path d="M 38 22 C 40.5 25 41 28 41 31" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
