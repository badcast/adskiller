<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Smartphone Frame -->
  <rect x="11" y="7" width="26" height="34" rx="4" stroke="#FFFFFF" stroke-width="2.5" fill="#0F172A"/>
  <line x1="21" y1="11" x2="27" y2="11" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="14" y="14" width="20" height="20" rx="2" fill="rgba(249, 115, 22, 0.12)" stroke="#FF6900" stroke-width="1"/>
  <line x1="20" y1="37" x2="28" y2="37" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Unlocked Shackle (Clear open gap on right) -->
  <path d="M19.5 23 V16.5 C19.5 14 28 14 28 16.5 V19" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Xiaomi Orange Lock Body -->
  <rect x="16.5" y="23" width="15" height="10" rx="2.5" fill="#FF6900" stroke="#FDBA74" stroke-width="1.5"/>
  <!-- Keyhole -->
  <circle cx="24" cy="27" r="1.3" fill="#FFFFFF"/>
  <line x1="24" y1="28" x2="24" y2="30.5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Unlock Burst Rays -->
  <line x1="30" y1="11" x2="34" y2="8" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="15" x2="38" y2="14" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round"/>
</svg>
