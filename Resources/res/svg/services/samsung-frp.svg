<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Samsung Smartphone Frame -->
  <rect x="9" y="6" width="30" height="36" rx="5" stroke="#FFFFFF" stroke-width="2.5" fill="#0F172A"/>
  <!-- Hole-punch Camera -->
  <circle cx="24" cy="10" r="1.3" fill="#38BDF8"/>
  <!-- Screen Area -->
  <rect x="12" y="13" width="24" height="22" rx="2" fill="rgba(37, 99, 235, 0.12)" stroke="#2563EB" stroke-width="1"/>
  <!-- Bottom Gesture Bar -->
  <line x1="20" y1="38.5" x2="28" y2="38.5" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- FRP Security Shield -->
  <path d="M24 16 L31 19.5 V25 C31 29 27.5 32 24 33 C20.5 32 17 29 17 25 V19.5 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
  <!-- Unlocked Padlock (FRP Bypass) -->
  <path d="M22 24 V21 C22 19.5 26 19.5 26 21 V22.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="20.5" y="24" width="7" height="6" rx="1.5" fill="#2563EB" stroke="#60A5FA" stroke-width="1.2"/>
  <circle cx="24" cy="26.5" r="0.8" fill="#FFFFFF"/>
  <!-- Unlock Rays Accent -->
  <line x1="33" y1="10" x2="37" y2="7" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="37" y1="13" x2="41" y2="12" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
</svg>
