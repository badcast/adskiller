<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Outer Cyber Gameboy/Arcade Screen Shell -->
  <rect x="6" y="6" width="36" height="36" rx="6" stroke="#1E293B" stroke-width="2" fill="#0A0E1A"/>
  <rect x="8" y="8" width="32" height="32" rx="4" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" fill="rgba(15, 23, 42, 0.6)"/>

  <!-- Background Grid Mesh Points -->
  <line x1="8" y1="18" x2="40" y2="18" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="8" y1="28" x2="40" y2="28" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="18" y1="8" x2="18" y2="40" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="28" y1="8" x2="28" y2="40" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Pixel Blast Block 1: Cyan Cube (Top-Left) -->
  <rect x="13" y="13" width="9" height="9" rx="1.5" fill="rgba(56, 189, 248, 0.3)" stroke="#38BDF8" stroke-width="1.8"/>
  <rect x="15" y="15" width="2.5" height="2.5" fill="#FFFFFF"/>

  <!-- Pixel Blast Block 2: Amber/Gold Cube (Top-Right / Exploding) -->
  <rect x="24" y="12" width="9" height="9" rx="1.5" fill="rgba(245, 158, 11, 0.35)" stroke="#F59E0B" stroke-width="1.8"/>
  <rect x="26" y="14" width="2.5" height="2.5" fill="#FDE68A"/>

  <!-- Pixel Blast Block 3: Emerald Cube (Bottom-Left) -->
  <rect x="13" y="24" width="9" height="9" rx="1.5" fill="rgba(52, 211, 153, 0.3)" stroke="#34D399" stroke-width="1.8"/>
  <rect x="15" y="26" width="2.5" height="2.5" fill="#A7F3D0"/>

  <!-- Pixel Blast Block 4: Purple/Magenta Cube (Center-Bottom) -->
  <rect x="24" y="24" width="9" height="9" rx="1.5" fill="rgba(192, 132, 252, 0.3)" stroke="#C084FC" stroke-width="1.8"/>
  <rect x="26" y="26" width="2.5" height="2.5" fill="#F5D0FE"/>

  <!-- Dynamic Blast Explosion Rays -->
  <line x1="33" y1="13" x2="41" y2="8" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="21" x2="43" y2="23" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28" y1="35" x2="33" y2="42" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="11" y1="11" x2="6" y2="7" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Exploding Flying Mini-Pixels -->
  <rect x="36" y="15" width="3" height="3" rx="0.5" fill="#FBBF24" transform="rotate(18 37.5 16.5)"/>
  <rect x="34" y="28" width="3" height="3" rx="0.5" fill="#EC4899" transform="rotate(30 35.5 29.5)"/>
  <rect x="9" y="32" width="2.5" height="2.5" rx="0.5" fill="#34D399" transform="rotate(45 10 33)"/>

  <!-- Blast Sparkle Star (Center explosion nexus) -->
  <path d="M24 19 L25.2 22.8 L29 24 L25.2 25.2 L24 29 L22.8 25.2 L19 24 L22.8 22.8 Z" fill="#FFFFFF"/>
</svg>
