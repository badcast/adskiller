<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Android Antennas -->
  <line x1="16" y1="8" x2="19" y2="13" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="8" x2="29" y2="13" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Android Head Dome -->
  <path d="M14 20 C14 14.5 18.5 13 24 13 C29.5 13 34 14.5 34 20 Z" fill="#34D399"/>
  <!-- Eyes -->
  <circle cx="19" cy="17.5" r="1.4" fill="#0F172A"/>
  <circle cx="29" cy="17.5" r="1.4" fill="#0F172A"/>
  <!-- App Package Box -->
  <rect x="8" y="22" width="32" height="21" rx="3.5" stroke="#FFFFFF" stroke-width="2.5" fill="rgba(52, 211, 153, 0.12)"/>
  <!-- Box Flap Line -->
  <line x1="8" y1="28" x2="40" y2="28" stroke="#334155" stroke-width="1.5"/>
  <!-- Install / Download Action Arrow -->
  <line x1="24" y1="25" x2="24" y2="37" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="19.5,33 24,37.5 28.5,33" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- App Dots Accent -->
  <circle cx="13" cy="34" r="1.5" fill="#38BDF8"/>
  <circle cx="35" cy="34" r="1.5" fill="#34D399"/>
</svg>
