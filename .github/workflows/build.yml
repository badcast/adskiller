name: Build Qt CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            qt_arch: linux_gcc_64
            qt_version: '6.10.0'
            artifact_name: Adskiller-Linux-GCC
          - name: Windows MSVC
            os: windows-latest
            qt_arch: win64_msvc2022_64
            qt_version: '6.10.0'
            setup_msvc: true
            artifact_name: Adskiller-Windows-MSVC
            package_name: Adskiller-Windows-MSVC
          - name: Windows MinGW
            os: windows-latest
            qt_arch: win64_mingw
            qt_version: '6.10.0'
            qt_tools: 'tools_mingw1310'
            cmake_flags: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++'
            artifact_name: Adskiller-Windows-MinGW
            package_name: Adskiller-Windows-MinGW

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure VERSION file exists
        run: |
          if [ ! -f "VERSION" ]; then echo "1.0.0" > VERSION; fi
        shell: bash

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgl-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0 \
            libasound2-dev libpulse-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            autoconf automake libtool pkg-config libplist-dev libimobiledevice-dev libusbmuxd-dev libzip-dev libcurl4-openssl-dev

      # - name: Build idevicerestore from official sources (Linux)
      #   if: runner.os == 'Linux'
      #   run: |
      #     bash scripts/build_idevicerestore.sh || true
      #
      # - name: Setup idevicerestore (Windows)
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   run: |
      #     & scripts/build_idevicerestore_win.ps1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC (Windows only)
        if: matrix.setup_msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}
          modules: 'qtmultimedia qtshadertools'
          cache: true

      - name: Configure CMake
        env:
          NREMOTEADDR: ${{ vars.NREMOTEADDR }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build Application and Update
        run: cmake --build build --target application update --parallel

      - name: Deploy Qt dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deployDir = Join-Path $PWD 'build/deploy'
          New-Item -ItemType Directory -Force -Path $deployDir | Out-Null
          Copy-Item 'build/adskiller.exe' $deployDir -Force
          Copy-Item 'build/update.exe' $deployDir -Force

          # Copy pixelblast DLL next to binary (libpixelblast.dll for MinGW, pixelblast.dll for MSVC)
          $dllName = if (Get-Command gcc -ErrorAction SilentlyContinue) { 'libpixelblast.dll' } else { 'pixelblast.dll' }
          if (Test-Path "build/$dllName") {
            Copy-Item "build/$dllName" $deployDir -Force
          } elseif (Test-Path "build/Source/services/pixelblast/$dllName") {
            Copy-Item "build/Source/services/pixelblast/$dllName" $deployDir -Force
          } else {
            Get-ChildItem -Path 'build' -Filter $dllName -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -ne $deployDir } | Select-Object -First 1 | ForEach-Object {
              Copy-Item $_.FullName $deployDir -Force
            }
          }

          Get-Command windeployqt -ErrorAction Stop | Out-Null
          windeployqt --release --no-translations --compiler-runtime --multimedia (Join-Path $deployDir 'adskiller.exe')
          windeployqt --release --no-translations --compiler-runtime (Join-Path $deployDir 'update.exe')


          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $gccDir = Split-Path (Get-Command gcc).Source
            @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll') | ForEach-Object {
              $dll = Join-Path $gccDir $_
              if (Test-Path $dll) { Copy-Item $dll $deployDir -Force }
            }
            strip (Join-Path $deployDir 'adskiller.exe')
            strip (Join-Path $deployDir 'update.exe')
            if (Test-Path (Join-Path $deployDir 'libpixelblast.dll')) {
              strip (Join-Path $deployDir 'libpixelblast.dll')
            }
          }

          if (Test-Path 'build/adb') {
            Copy-Item 'build/adb' (Join-Path $deployDir 'adb') -Recurse -Force
          } elseif (Test-Path '3rdParty/adb') {
            Copy-Item '3rdParty/adb' (Join-Path $deployDir 'adb') -Recurse -Force
          }

          if (Test-Path 'build/apple') {
            Copy-Item 'build/apple' (Join-Path $deployDir 'apple') -Recurse -Force
          } elseif (Test-Path '3rdParty/apple') {
            Copy-Item '3rdParty/apple' (Join-Path $deployDir 'apple') -Recurse -Force
          }

      - name: Upload Artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/adskiller
            build/update
            build/apple/
            build/Source/services/pixelblast/libpixelblast.so
          if-no-files-found: warn

      - name: Package ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Portable archive of the deployed folder (used for updates). 7-Zip writes portable '/' paths.
          $zip = Join-Path $PWD 'build/${{ matrix.package_name }}.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Push-Location 'build/deploy'
          7z a -tzip -mx=9 $zip '*' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Inno Setup ships with the runner image; install it only if it is missing.
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($dir in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              $candidate = Join-Path $dir 'Inno Setup 6\ISCC.exe'
              if (Test-Path $candidate) { $iscc = $candidate; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe (Inno Setup) not found' }

          $version = (Get-Content 'VERSION' -Raw).Trim()
          $deploy = Join-Path $PWD 'build/deploy'
          & $iscc "/DAppVersion=$version" "/DSourceDir=$deploy" "/DOutputName=${{ matrix.package_name }}-Setup" 'installer/adskiller.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Smoke-test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Silent per-user install into a temp dir, check the files, then uninstall.
          $setup = Join-Path $PWD 'build/installer/${{ matrix.package_name }}-Setup.exe'
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }
          $target = Join-Path $env:RUNNER_TEMP 'adskiller-install'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          foreach ($f in @('adskiller.exe', 'update.exe', 'platforms/qwindows.dll')) {
            if (-not (Test-Path (Join-Path $target $f))) { throw "Missing after install: $f" }
          }
          $unins = Get-ChildItem $target -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $unins) { throw 'Uninstaller was not created' }
          $u = Start-Process $unins.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exit code $($u.ExitCode)" }

      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/installer/${{ matrix.package_name }}-Setup.exe
            build/${{ matrix.package_name }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Adskiller-Windows-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*-Setup.exe
            release/*.zip
          generate_release_notes: true
