name: Build Qt App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: linux
          - os: windows-latest
            toolchain: msvc
          - os: windows-latest
            toolchain: mingw64
          - os: macos-latest
            toolchain: macos

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install OpenGL dependencies (Linux)
      if: matrix.toolchain == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libx11-xcb-dev libxcb-glx0-dev

    - name: Install Qt (non-mingw)
      if: matrix.toolchain != 'mingw64'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.0'
        modules: 'qtmultimedia'

    - name: Setup MSYS2 + MinGW64 (Windows mingw64)
      if: matrix.toolchain == 'mingw64'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: |
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-qt6

    - name: Configure CMake (MSVC)
      if: matrix.toolchain == 'msvc' && runner.os == 'Windows'
      run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir

    - name: Configure CMake (MinGW)
      if: matrix.toolchain == 'mingw64'
      shell: bash
      run: |
        mkdir -p build
        cd build
        # Ensure MinGW Qt6 is visible to CMake
        export Qt6_DIR=/mingw64/lib/cmake/Qt6
        export CMAKE_PREFIX_PATH=/mingw64/lib/cmake:$CMAKE_PREFIX_PATH
        cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir -DQt6_DIR="$Qt6_DIR" ..

    - name: Configure CMake (Unix/macOS)
      if: matrix.toolchain == 'linux' || matrix.toolchain == 'macos'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir

    - name: Build (MSVC)
      if: matrix.toolchain == 'msvc'
      run: cmake --build build --config Release --target install -v

    - name: Build (MinGW)
      if: matrix.toolchain == 'mingw64'
      shell: bash
      run: |
        cd build
        mingw32-make -j$(nproc)

    - name: Build (Unix/macOS)
      if: matrix.toolchain == 'linux' || matrix.toolchain == 'macos'
      run: cmake --build build --config Release --target install -j

    - name: Deploy Qt (Windows MSVC)
      if: matrix.toolchain == 'msvc' && runner.os == 'Windows'
      shell: cmd
      run: |
        if exist install_dir\bin\adskiller.exe (
          windeployqt --release install_dir\bin\adskiller.exe
        )

    - name: Deploy Qt (Windows MinGW)
      if: matrix.toolchain == 'mingw64'
      shell: bash
      run: |
        # attempt to copy Qt plugins from MSYS2
        QT_PLUGIN_PATH="/mingw64/lib/qt5/plugins"
        if [ -d "$QT_PLUGIN_PATH/multimedia" ]; then
          mkdir -p install_dir/lib/plugins/multimedia
          cp -r "$QT_PLUGIN_PATH/multimedia/"* install_dir/lib/plugins/multimedia/ || true
        fi

    - name: Deploy Qt (macOS)
      if: matrix.toolchain == 'macos'
      run: |
        QT_PLUGIN_PATH="${Qt6_DIR}/../../../plugins"
        APP_BUNDLE=$(find install_dir -name "*.app" -maxdepth 1 | head -1)
        if [ -n "$APP_BUNDLE" ] && [ -d "$QT_PLUGIN_PATH/multimedia" ]; then
          mkdir -p "$APP_BUNDLE/Contents/PlugIns/multimedia"
          cp -r "$QT_PLUGIN_PATH/multimedia/"* "$APP_BUNDLE/Contents/PlugIns/multimedia/"
        fi

    - name: Include adb in install_dir (Linux/macOS)
      if: github.ref != 'refs/heads/new_version_v2_beta' && (runner.os == 'Linux' || runner.os == 'macOS')
      run: |
        if [ -d "3rdParty/adb" ]; then
          mkdir -p install_dir/3rdParty
          cp -r 3rdParty/adb install_dir/3rdParty/adb || true
        fi

    - name: Include adb in install_dir (Windows)
      if: github.ref != 'refs/heads/new_version_v2_beta' && runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Test-Path -Path "3rdParty\adb") {
          New-Item -ItemType Directory -Force -Path install_dir\3rdParty | Out-Null
          Copy-Item -Path 3rdParty\adb -Destination install_dir\3rdParty\adb -Recurse -Force
        }

    - name: Build `update` target (only for new_version_v2_beta)
      if: github.ref == 'refs/heads/new_version_v2_beta'
      run: |
        # Build only the update target to speed up CI
        if [ -d build ]; then
          cmake --build build --target update --config Release -j || true
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release ..
          cmake --build build --target update --config Release -j || true
        fi

    - name: Prepare update-only artifact (non-Windows)
      if: github.ref == 'refs/heads/new_version_v2_beta' && runner.os != 'Windows'
      run: |
        rm -rf artifact_update || true
        mkdir -p artifact_update
        # copy built binaries (if any)
        if [ -d build ]; then
          cp -r build/update* artifact_update/ || true
        fi
        # copy source update folder and adb
        cp -r update artifact_update/update_source || true
        if [ -d "3rdParty/adb" ]; then
          cp -r 3rdParty/adb artifact_update/adb || true
        fi

    - name: Prepare update-only artifact (Windows)
      if: github.ref == 'refs/heads/new_version_v2_beta' && runner.os == 'Windows'
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force artifact_update -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path artifact_update | Out-Null
        if (Test-Path -Path build\update.exe) {
          Copy-Item -Path build\update.exe -Destination artifact_update -Force
        }
        Copy-Item -Path update -Destination artifact_update\update_source -Recurse -Force
        if (Test-Path -Path 3rdParty\adb) {
          Copy-Item -Path 3rdParty\adb -Destination artifact_update\adb -Recurse -Force
        }

    - name: Upload Artifact (update-only)
      if: github.ref == 'refs/heads/new_version_v2_beta'
      uses: actions/upload-artifact@v4
      with:
        name: adskiller-update-${{ matrix.toolchain }}-${{ runner.os }}
        path: |
          artifact_update/

    - name: Upload Artifact (full)
      if: github.ref != 'refs/heads/new_version_v2_beta'
      uses: actions/upload-artifact@v4
      with:
        name: adskiller-${{ matrix.toolchain }}-${{ runner.os }}
        path: install_dir/
