name: Build adskiller

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.8.3"

jobs:

  # ============================================================
  # Linux / GCC
  # ============================================================
  linux:
    name: Linux / GCC / Qt6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-keysyms1 \
            libxcb-image0 \
            libxcb-render-util0

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_dir"

      - name: Build
        run: cmake --build build --parallel --target application update

      - name: Install
        run: cmake --install build

      - name: Verify
        run: |
          echo "=== install_dir ==="
          find install_dir -maxdepth 4 -type f | sort
          test -f install_dir/bin/adskiller

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adskiller-linux
          path: install_dir/
          if-no-files-found: error


  # ============================================================
  # Windows / MSVC
  # ============================================================
  windows-msvc:
    name: Windows / MSVC / Qt6
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          $qtDir = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/win64_msvc2022_64"

          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="$qtDir" `
            -DQt6_DIR="$qtDir/lib/cmake/Qt6" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_dir"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config ${{ env.BUILD_TYPE }} `
            --parallel `
            --target application update

      - name: Install
        shell: pwsh
        run: cmake --install build --config ${{ env.BUILD_TYPE }}

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          $qtBin = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/win64_msvc2022_64/bin"
          $wdqt  = "$qtBin/windeployqt.exe"

          if (-not (Test-Path $wdqt)) {
            throw "windeployqt.exe not found at: $wdqt"
          }

          $binDir = "${{ github.workspace }}/install_dir/bin"

          & $wdqt --release --no-translations --compiler-runtime "$binDir/adskiller.exe"

          if (Test-Path "$binDir/update.exe") {
            & $wdqt --release --no-translations --compiler-runtime "$binDir/update.exe"
          }

      - name: Copy adb
        shell: pwsh
        run: |
          $src  = "${{ github.workspace }}/3rdParty/adb"
          $dest = "${{ github.workspace }}/install_dir/adb"

          if (-not (Test-Path $src)) { throw "3rdParty/adb not found" }
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$src/*" $dest -Recurse -Force

      - name: Verify
        shell: pwsh
        run: |
          Write-Host "=== install_dir ==="
          Get-ChildItem "${{ github.workspace }}/install_dir" -Recurse | Select-Object FullName

          if (-not (Test-Path "${{ github.workspace }}/install_dir/bin/adskiller.exe")) {
            throw "adskiller.exe not found"
          }
          if (-not (Test-Path "${{ github.workspace }}/install_dir/adb")) {
            throw "adb directory not found"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adskiller-windows-msvc
          path: install_dir/
          if-no-files-found: error


  # ============================================================
  # Windows / MinGW64 (MSYS2)
  # ============================================================
  windows-mingw:
    name: Windows / MinGW64 / Qt6
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 + MinGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-declarative

      - name: Verify toolchain
        run: |
          echo "=== GCC ==="
          g++ --version
          echo "=== CMake ==="
          cmake --version
          echo "=== Ninja ==="
          ninja --version
          echo "=== Qt6Config ==="
          test -f /mingw64/lib/cmake/Qt6/Qt6Config.cmake && echo "OK" || { echo "MISSING"; exit 1; }

      - name: Configure
        run: |
          rm -rf build install_dir
          mkdir -p build install_dir

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DQt6_DIR=/mingw64/lib/cmake/Qt6 \
            -DCMAKE_INSTALL_PREFIX="$PWD/install_dir"

      - name: Build
        run: cmake --build build --parallel --target application update

      - name: Install
        run: cmake --install build

      - name: Copy adb
        run: |
          test -d 3rdParty/adb
          mkdir -p install_dir/adb
          cp -a 3rdParty/adb/. install_dir/adb/

      - name: Deploy Qt runtime (copy DLLs)
        run: |
          BIN_DIR="$PWD/install_dir/bin"

          for dll in Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Network.dll Qt6Svg.dll; do
            [ -f "/mingw64/bin/$dll" ] && cp -f "/mingw64/bin/$dll" "$BIN_DIR/"
          done

          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            [ -f "/mingw64/bin/$dll" ] && cp -f "/mingw64/bin/$dll" "$BIN_DIR/"
          done

          mkdir -p "$BIN_DIR/../plugins/platforms"
          cp -f /mingw64/share/qt6/plugins/platforms/qwindows.dll "$BIN_DIR/../plugins/platforms/"

          if [ -d /mingw64/share/qt6/plugins/imageformats ]; then
            mkdir -p "$BIN_DIR/../plugins/imageformats"
            cp -a /mingw64/share/qt6/plugins/imageformats/. "$BIN_DIR/../plugins/imageformats/"
          fi

      - name: Verify
        run: |
          echo "=== install_dir ==="
          find install_dir -maxdepth 5 -type f | sort

          test -f install_dir/bin/adskiller.exe
          test -f install_dir/bin/update.exe
          test -d install_dir/adb
          test -f install_dir/plugins/platforms/qwindows.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adskiller-windows-mingw64
          path: install_dir/
          if-no-files-found: error
