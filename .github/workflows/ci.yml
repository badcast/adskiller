name: CI

on:
  push:
  pull_request:

jobs:
  mingw:
    name: Windows - MinGW
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure and build (MinGW)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=/mingw64/bin/ninja -DCMAKE_C_COMPILER=/mingw64/bin/gcc -DCMAKE_CXX_COMPILER=/mingw64/bin/g++
          cmake --build build --config Release
      - name: Run tests (if present)
        shell: bash
        run: |
          if [ -f build/CTestTestfile.cmake ]; then ctest --test-dir build || true; fi

  msvc:
    name: Windows - MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC)
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build (MSVC)
        shell: cmd
        run: cmake --build build --config Release -- /m
      - name: Run tests (MSVC)
        shell: cmd
        run: |
          powershell -Command "if (Test-Path build/CTestTestfile.cmake) { ctest -C Release -T test -V }"

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build
      - name: Configure and build (Linux)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -- -j$(nproc)
      - name: Run tests (if present)
        run: |
          if [ -f build/CTestTestfile.cmake ]; then ctest --test-dir build || true; fi
